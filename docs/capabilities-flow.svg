<svg xmlns="http://www.w3.org/2000/svg" width="680" height="630" viewBox="0 0 680 630" role="img">
  <title>query-grid capability flow</title>
  <desc>Host defs feed the memory source or postgres capabilities, which produce one Capabilities object; the provider passes it to the offers, which enable components, and the server checks each request against indexes again.</desc>
  <style>
    text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .th { font-size: 14px; font-weight: 500; }
    .ts { font-size: 12px; }
    .arr { fill: none; stroke: #888780; stroke-width: 1.5; }
    .legend { fill: #5F5E5A; }
    .core rect { fill: #EEEDFE; stroke: #534AB7; } .core .th { fill: #3C3489; } .core .ts { fill: #534AB7; }
    .react rect { fill: #E1F5EE; stroke: #0F6E56; } .react .th { fill: #085041; } .react .ts { fill: #0F6E56; }
    .pg rect { fill: #FAECE7; stroke: #993C1D; } .pg .th { fill: #712B13; } .pg .ts { fill: #993C1D; }
    .host rect { fill: #F1EFE8; stroke: #5F5E5A; } .host .th { fill: #444441; } .host .ts { fill: #5F5E5A; }
    @media (prefers-color-scheme: dark) {
      .legend { fill: #B4B2A9; }
      .core rect { fill: #3C3489; stroke: #AFA9EC; } .core .th { fill: #CECBF6; } .core .ts { fill: #AFA9EC; }
      .react rect { fill: #085041; stroke: #5DCAA5; } .react .th { fill: #9FE1CB; } .react .ts { fill: #5DCAA5; }
      .pg rect { fill: #712B13; stroke: #F0997B; } .pg .th { fill: #F5C4B3; } .pg .ts { fill: #F0997B; }
      .host rect { fill: #444441; stroke: #B4B2A9; } .host .th { fill: #D3D1C7; } .host .ts { fill: #B4B2A9; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <g class="host"><rect x="230" y="40" width="220" height="56" rx="8" stroke-width="0.5"/>
    <text class="th" x="340" y="58" text-anchor="middle" dominant-baseline="central">Host defs</text>
    <text class="ts" x="340" y="78" text-anchor="middle" dominant-baseline="central">FieldDef, GridDef</text></g>
  <g class="core"><rect x="100" y="136" width="220" height="56" rx="8" stroke-width="0.5"/>
    <text class="th" x="210" y="154" text-anchor="middle" dominant-baseline="central">Memory source</text>
    <text class="ts" x="210" y="174" text-anchor="middle" dominant-baseline="central">From field operators</text></g>
  <g class="pg"><rect x="360" y="136" width="220" height="56" rx="8" stroke-width="0.5"/>
    <text class="th" x="470" y="154" text-anchor="middle" dominant-baseline="central">Postgres</text>
    <text class="ts" x="470" y="174" text-anchor="middle" dominant-baseline="central">capabilities(indexes)</text></g>
  <g class="core"><rect x="230" y="232" width="220" height="56" rx="8" stroke-width="0.5"/>
    <text class="th" x="340" y="250" text-anchor="middle" dominant-baseline="central">Capabilities</text>
    <text class="ts" x="340" y="270" text-anchor="middle" dominant-baseline="central">isAnswerable, sort, search</text></g>
  <g class="react"><rect x="230" y="328" width="220" height="56" rx="8" stroke-width="0.5"/>
    <text class="th" x="340" y="346" text-anchor="middle" dominant-baseline="central">QueryGridProvider</text>
    <text class="ts" x="340" y="366" text-anchor="middle" dominant-baseline="central">Query store and stores</text></g>
  <g class="core"><rect x="230" y="424" width="220" height="56" rx="8" stroke-width="0.5"/>
    <text class="th" x="340" y="442" text-anchor="middle" dominant-baseline="central">listOffers, applyAction</text>
    <text class="ts" x="340" y="462" text-anchor="middle" dominant-baseline="central">Asks isAnswerable per action</text></g>
  <g class="react"><rect x="230" y="520" width="220" height="56" rx="8" stroke-width="0.5"/>
    <text class="th" x="340" y="538" text-anchor="middle" dominant-baseline="central">Components</text>
    <text class="ts" x="340" y="558" text-anchor="middle" dominant-baseline="central">Enable, disable, reason</text></g>
  <g class="pg"><rect x="474" y="520" width="166" height="56" rx="8" stroke-width="0.5"/>
    <text class="th" x="557" y="538" text-anchor="middle" dominant-baseline="central">Server check</text>
    <text class="ts" x="557" y="558" text-anchor="middle" dominant-baseline="central">Index match or 400</text></g>

  <path class="arr" d="M290 96 V116 H210 V134" marker-end="url(#arrow)"/>
  <path class="arr" d="M390 96 V116 H470 V134" marker-end="url(#arrow)"/>
  <path class="arr" d="M210 192 V212 H300 V230" marker-end="url(#arrow)"/>
  <path class="arr" d="M470 192 V212 H380 V230" marker-end="url(#arrow)"/>
  <path class="arr" d="M340 288 V326" marker-end="url(#arrow)"/>
  <path class="arr" d="M340 384 V422" marker-end="url(#arrow)"/>
  <path class="arr" d="M340 480 V518" marker-end="url(#arrow)"/>
  <path class="arr" d="M450 548 H472" marker-end="url(#arrow)"/>

  <g class="core"><rect x="170" y="600" width="12" height="12" rx="2" stroke-width="0.5"/></g>
  <text class="ts legend" x="188" y="606" dominant-baseline="central">core</text>
  <g class="react"><rect x="260" y="600" width="12" height="12" rx="2" stroke-width="0.5"/></g>
  <text class="ts legend" x="278" y="606" dominant-baseline="central">react</text>
  <g class="pg"><rect x="352" y="600" width="12" height="12" rx="2" stroke-width="0.5"/></g>
  <text class="ts legend" x="370" y="606" dominant-baseline="central">postgres</text>
  <g class="host"><rect x="456" y="600" width="12" height="12" rx="2" stroke-width="0.5"/></g>
  <text class="ts legend" x="474" y="606" dominant-baseline="central">host app</text>
</svg>
