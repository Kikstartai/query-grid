name: Benchmark

# The full benchmark, weekly and on demand. It runs on no push, pull request or release, so it never blocks one.
on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: benchmark
  cancel-in-progress: false

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      QUERY_GRID_DATABASE_URL: ${{ secrets.QUERY_GRID_BENCH_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.4

      - name: Check the database secret
        run: |
          if [ -z "$QUERY_GRID_DATABASE_URL" ]; then
            echo "::error::The repository secret QUERY_GRID_BENCH_DATABASE_URL is not set."
            exit 1
          fi

      - run: bun install --frozen-lockfile

      - run: bun run build:package

      - name: Run the full benchmark
        working-directory: apps/demo
        run: bun db/bench.ts > bench-output.txt

      - name: Publish the results
        if: always()
        working-directory: apps/demo
        run: |
          if [ -f db/bench-results.md ]; then
            cat db/bench-results.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Keep the results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-results
          path: apps/demo/db/bench-results.md
          if-no-files-found: ignore
